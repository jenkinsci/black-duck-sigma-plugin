variables:
    ARTIFACTORY_URL: https://artifactory.tools.duckutil.net/artifactory
    ARTIFACTORY_REGISTRY: artifactory.tools.duckutil.net:5002
    ARTIFACTORY_JFROG_URL: $ARTIFACTORY_URL/sigma-local/devops/helpers/jfrog/jfrog.linux_x86_64

.jfrog_before_script:
    - curl --silent --output jfrog $ARTIFACTORY_JFROG_URL
    - chmod a+x jfrog
    - ./jfrog rt config import ${SIGMA_CICD_ARTIFACTORY_CONFIG}

# Common Rules
.manually_run_in_merge_requests:
    if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_EVENT_TYPE != 'merge_train'
    when: manual
.never_run_for_scheduled_jobs:
    if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
.only_run_for_scheduled_jobs:
    if: $CI_PIPELINE_SOURCE != "schedule"
    when: never
.always_run_for_tags:
    if: $CI_COMMIT_TAG
.always_run_for_master_branch:
    if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH